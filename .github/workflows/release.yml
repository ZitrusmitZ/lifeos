name: Release image

# Baut nach jeder grünen CI auf main ein Docker-Image und legt es in GHCR ab.
# Der VPS zieht es selbst (systemd-Timer) – GitHub braucht keinen Zugang zum Server.
# Rote CI → kein Image → der VPS bleibt auf der letzten funktionierenden Version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Ist der geprüfte Commit noch der Stand von main? Enden zwei CI-Läufe in vertauschter Reihenfolge,
  # darf das ältere Release `latest` nicht überschreiben – der neuere Commit bekommt sein eigenes Release.
  # Bewusst ein eigener Job ohne concurrency: GitHub hält pro Gruppe nur einen wartenden Lauf und
  # verwirft den bisherigen, wenn ein neuer dazukommt – ein veralteter Lauf darf also gar nicht erst einreihen.
  current:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # workflow_dispatch baut github.sha wie gewünscht, ohne Abgleich
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$HEAD_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA ist nicht mehr main ($main) – kein Release, der neuere Commit bringt sein eigenes"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: current
    if: needs.current.outputs.build == 'true'
    # nie abbrechen: ein laufender Build ist der bisher neueste Stand; ein neuerer wartet und überschreibt danach
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # genau den Commit bauen, den die CI geprüft hat (nicht einen inzwischen neueren main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # SHA des geprüften Commits; bei workflow_run ist github.sha der aktuelle main-Stand, nicht zwingend dieser
      - id: rev
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT" && echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # aus dem Repo abgeleitet (metadata-action schreibt klein) – übersteht Umbenennungen des GitHub-Accounts
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.rev.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.full }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
