# LifeOS – lokal: `docker compose up --build`, auf dem VPS: Image aus GHCR (deploy/bootstrap-vps.sh)
services:
  lifeos:
    image: ghcr.io/zitrusmitz/lifeos:latest
    build: .
    container_name: lifeos
    restart: unless-stopped
    env_file: .env
    # Nur Loopback! Erreichbar ist LifeOS ausschließlich über `tailscale serve` (HTTPS im Tailnet).
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      # LocalAPI von tailscaled (nur lesend genutzt): Allowlist „owner“ überlebt Login-Umbenennungen.
      # Ordner statt Datei, damit der Socket nach einem tailscaled-Neustart wieder erreichbar ist.
      - /var/run/tailscale:/var/run/tailscale:ro
      # Web-Chat mit dem LifeOS-Agenten (Host-Dienst lifeos-agent, Unix-Socket web.sock, Auth über CRON_TOKEN).
      # Ebenfalls der Ordner, damit ein Agent-Neustart den Socket nicht „verliert“.
      - /run/lifeos-agent:/run/lifeos-agent:ro
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Öffentliche Freigabe-Links aus „Dateien“ (/d/<token>) über Tailscale Funnel – unter einem EIGENEN Namen
  # (lifeos-share.<tailnet>.ts.net). Funnel macht den Namen im öffentlichen DNS sichtbar; läge er auf dem Server-Namen,
  # würden Browser mit eigenem DNS (iCloud Privat-Relay, Brave Secure DNS) das Dashboard nicht mehr erreichen.
  # Nur mit `COMPOSE_PROFILES=share` und `SHARE_TS_AUTHKEY` in der .env aktiv, siehe docs/SETUP.md.
  share:
    image: tailscale/tailscale:v1.104.2
    container_name: lifeos-share
    profiles: ["share"]
    restart: unless-stopped
    hostname: lifeos-share
    environment:
      TS_AUTHKEY: ${SHARE_TS_AUTHKEY:-}
      TS_HOSTNAME: lifeos-share
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Nur /d/ wird weitergereicht – alles andere beantwortet der Container selbst mit 404.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - share-state:/var/lib/tailscale
      - ./deploy/share/serve.json:/config/serve.json:ro
    depends_on:
      - lifeos
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  share-state:
