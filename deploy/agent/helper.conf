# Whitelist für den Root-Helfer des LifeOS-Agenten → /etc/lifeos-agent/helper.conf (root:root 644).
# Muss zu AGENT_SERVICES / AGENT_BACKUP_TARGETS / AGENT_GIT_PROJECTS in agent.env passen.
# Was hier fehlt, kann der Agent nicht ausführen – egal was in agent.env steht.

# systemd-Dienste, die neu gestartet werden dürfen (ohne .service)
ALLOWED_SYSTEMD="ollama tailscaled playit"
# Docker-Container: Status, Logs, Neustart
ALLOWED_DOCKER="lifeos minecraft pihole nextcloud nextcloud-db"
MC_CONTAINER="minecraft"
# Backup-Ziel=systemd-Unit (bestehende Timer-Dienste)
BACKUP_UNITS="lifeos=lifeos-backup.service minecraft=minecraft-backup.service offsite=offsite-backup.service"
# Projekt=Verzeichnis für git pull --ff-only
PROJECTS="lifeos=/opt/lifeos"
# Deploy (lifeos_deploy): Checkout mit compose.override.yaml, Branch, GHCR-Image, Container für den Health-Check
DEPLOY_DIR="/opt/lifeos"
DEPLOY_BRANCH="main"
DEPLOY_IMAGE="ghcr.io/zitrusmitz/lifeos"
DEPLOY_CONTAINER="lifeos"

# Root-Befehle (Tool server_command / root_command): beliebiger Befehl als root, aber jeder einzelne erst nach
# „Ausführen“ im Chat. Läuft außerhalb der Sandbox des Agenten; Protokoll in ROOT_EXEC_LOG (gehört root).
ROOT_EXEC="true"
ROOT_EXEC_LOG="/var/log/lifeos-agent/root-exec.log"
# Coding-Agents (code_start): Name=Repo-Verzeichnis, Nutzer, max. gleichzeitig. Muss zu AGENT_CODE_REPOS passen.
CODE_REPOS="lifeos=/home/luis/src/lifeos"
CODE_USER="luis"
CODE_MAX="2"
