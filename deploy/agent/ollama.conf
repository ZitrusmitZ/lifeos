# Drop-in für ollama.service → /etc/systemd/system/ollama.service.d/lifeos.conf
# Kleines Modell, ein Request gleichzeitig, RAM nach 5 Min ohne Anfrage wieder frei. Minecraft hat Vorrang.
[Service]
Environment=OLLAMA_HOST=127.0.0.1:11434
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_KEEP_ALIVE=5m
MemoryMax=5G
Nice=10
CPUWeight=30
