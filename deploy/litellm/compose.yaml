# FreeLLM: LiteLLM-Proxy mit kostenlosen Kontingenten (Groq, Gemini, Cerebras, OpenRouter :free).
# Installiert nach /opt/litellm von scripts/install_litellm.sh. Nur auf 127.0.0.1 – der LifeOS-Agent auf dem Host
# ist der einzige Client. Keys + Master-Key: /etc/litellm/litellm.env (root 600).
services:
  litellm:
    # v1.102.0, per Digest gepinnt (Updates bewusst: Tag + Digest hier ändern, install_litellm.sh erneut ausführen)
    image: ghcr.io/berriai/litellm:v1.102.0@sha256:32cfd7a427f6470033b4dcc9e75dfbea2aa32dbc298b0b511a40e962ce818362
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    env_file: /etc/litellm/litellm.env
    environment:
      LITELLM_TELEMETRY: "False"
      LITELLM_LOG: "WARNING"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    # Minecraft hat Vorrang
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
